user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  # ── AI 判分上游（v3.6 完全切换到 Agent2API :3065）────────────
  # 主：Agent2API 网关 NAS_HOST_REPLACE_ME:3065（20 个判分模型，前端按需故障转移）。
  # 原 freellmapi :3201 与 Windows Ollama 备胎已移除：
  #   它们不支持新模型名，切过去会 404，反而干扰前端的 20 模型容灾链。
  # 模型级故障转移由前端 aiRequest() 负责（超时/限流/失效即切下一个）。
  upstream ai_backend {
    server NAS_HOST_REPLACE_ME:3065;
  }
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/site;
    index index.html;
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }

    # ── 云端同步 API 反向代理（v2.4）────────────────────────────
    location /api/ {
      proxy_pass http://NAS_HOST_REPLACE_ME:8877/api/;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
      client_max_body_size 6m;
    }

    # ── AI 网关反向代理（v3.6 指向 Agent2API :3065）──────────────
    # 浏览器不持有 Key：同源 /ai/ → nginx 转发到 :3065/v1/ 并服务端注入 Key。
    # 模型名由前端请求体携带，命中 20 个候选中的可用模型；失效即切下一个。
    location /ai/ {
      proxy_pass http://ai_backend/v1/;
      proxy_set_header Authorization "Bearer sk-REPLACE_WITH_YOUR_AI_GATEWAY_KEY";
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_buffering off;
      client_max_body_size 12m;
    }
  }
}
